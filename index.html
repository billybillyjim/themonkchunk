<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Interactive OSRS random event timeline map and dry-streak analysis">
	<title>TheMonkChunk Random Event Timeline</title>

	<link href="bootstrap.css" rel="stylesheet">

	<style>
		[v-cloak] {
			display: none;
		}

		html {
			min-width: 320px;
			background: black;
		}

		.map-stage {
			position: relative;
			width: min(100%, 48rem);
			aspect-ratio: 1;
			overflow: hidden;
			margin-inline: auto;
			background: var(--bs-dark-bg-subtle);
			user-select: none;
		}

		.chunk-map,
		.map-grid {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
		}

		.chunk-map {
			object-fit: cover;
			image-rendering: pixelated;
		}

		.map-grid {
			pointer-events: none;
			background-image:
				linear-gradient(to right, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
				linear-gradient(to bottom, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
			background-size: calc(100% / 64) calc(100% / 64);
		}

		.map-marker {
			position: absolute;
			z-index: 2;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 2rem;
			height: 2rem;
			padding: 2px;
			
			border: 2px solid var(--bs-white);
			border-radius: 50%;
			background: var(--bs-danger);
			color: var(--bs-white);
			font-size: 0.75rem;
			font-weight: 700;
			line-height: 1;
			box-shadow: var(--bs-box-shadow-sm);
			transform: translate(-50%, -50%);
		}

		.map-marker.is-past {
			background: var(--bs-secondary);
			opacity: 0.5;
		}

		.map-marker.is-selected {
			z-index: 3;
			width: 2.25rem;
			height: 2.25rem;
			background: var(--bs-warning);
			color: var(--bs-dark);
			border-color: var(--bs-dark);
			opacity: 1;
		}

		.map-edge {
			position: absolute;
			z-index: 4;
			padding: 0.2rem 0.45rem;
			border-radius: var(--bs-border-radius-sm);
			background: rgba(0, 0, 0, 0.65);
			color: var(--bs-white);
			font-size: 0.75rem;
			pointer-events: none;
		}

		.edge-north {
			top: 0.5rem;
			left: 50%;
			transform: translateX(-50%);
		}

		.edge-south {
			bottom: 0.5rem;
			left: 50%;
			transform: translateX(-50%);
		}

		.edge-west {
			top: 50%;
			left: 0.5rem;
			transform: translateY(-50%);
		}

		.edge-east {
			top: 50%;
			right: 0.5rem;
			transform: translateY(-50%);
		}

		.timeline-list {
			max-height: 32rem;
			overflow-y: auto;
		}

		.timeline-event.is-past {
			opacity: 0.65;
		}

		.timeline-event.is-selected {
			--bs-list-group-bg: var(--bs-primary-bg-subtle);
			--bs-list-group-color: var(--bs-primary-text-emphasis);
			--bs-list-group-border-color: var(--bs-primary-border-subtle);
		}

		.analytics-table th,
		.analytics-table td {
			white-space: nowrap;
			vertical-align: middle;
		}

		.analytics-table th:first-child {
			min-width: 15rem;
			white-space: normal;
		}

		.analytics-sort-button {
			display: inline-flex;
			align-items: center;
			gap: 0.35rem;
			width: 100%;
			padding: 0;
			border: 0;
			background: transparent;
			color: inherit;
			font: inherit;
			font-weight: 600;
			text-align: left;
			white-space: nowrap;
		}

		.analytics-sort-button:hover,
		.analytics-sort-button:focus-visible {
			color: var(--bs-primary);
		}

		.analytics-sort-indicator {
			min-width: 0.75rem;
			font-size: 0.7em;
			line-height: 1;
		}

		.is-dry-row>* {
			background-color: var(--bs-info-bg-subtle) !important;
		}

		@include color-mode(dark) {

		}
	</style>
</head>

<body class="bg-body-tertiary">
	<main id="app" class="container-xxl py-4 py-lg-5" v-cloak>
		<header class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 mb-4">
			<div>
				<p class="mb-1 text-uppercase fw-semibold small text-primary">
					<a href="https://wiseoldman.net/players/themonkchunk/gained?metric=overall&period=year">TheMonkChunk</a></p>
				<h1 class="display-5 fw-bold mb-1">Random event timeline</h1>
				<p class="lead text-body-secondary mb-0">Monastery chunk - Last Updated [[ lastModified ]]</p>
			</div>

			<div class="card shadow-sm border-0">
				<div class="card-body py-3 px-4 text-md-end" aria-label="Event count">
					<strong class="d-block fs-3 lh-1">[[ events.length.toLocaleString() ]]</strong>
					<span class="text-body-secondary">recorded events</span>
				</div>
				<div class="card-body py-3 px-4 text-md-end" aria-label="Event count">
					<strong class="d-block fs-3 lh-1">~[[ events.length * 90 / 60 / 24 ]]</strong>
					<span class="text-body-secondary">Days of playtime</span>
				</div>
			</div>
		</header>

		<section v-if="isLoading" class="card shadow-sm mb-4" aria-live="polite">
			<div class="card-body p-4">
				<div class="d-flex align-items-center gap-3">
					<div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
					<div>
						<h2 class="h5 mb-1">Loading random events</h2>
						<p class="mb-0 text-body-secondary">Loading...</p>
					</div>
				</div>
			</div>
		</section>
		<template v-else>
			<section class="row g-4 mb-4" aria-label="Random event map and selected event">
				<div class="col-12 col-xl-8">
					<div class="card shadow-sm h-100">
						<div class="card-header bg-body d-flex flex-column flex-sm-row align-items-sm-start justify-content-between gap-3 p-3 p-lg-4">
							<div>
								<h2 class="h4 mb-1">Spawn map</h2>
								<p class="text-body-secondary mb-0">Each numbered marker is one random event NPC spawn.</p>
							</div>
						</div>

						<div class="card-body p-3 p-lg-4">
							<div class="map-stage border rounded-1 shadow-sm" ref="mapStage" @mousemove="updateCursorTile" @mouseleave="cursorTile = null" role="img"
								aria-label="OSRS Monastery chunk map with numbered random event markers">
								<img class="chunk-map" src="MonasteryChunk.png" alt="OSRS Monastery chunk map" width="192" height="192" draggable="false">

								<div class="map-grid" aria-hidden="true"></div>

								<button v-for="marker in visibleMarkers" :key="marker.key" class="map-marker" :class="{ 'is-selected': marker.eventIndex == selectedIndex, 'is-past': marker.eventIndex < selectedIndex}"
									:style="markerStyle(marker)" @click.stop="selectEvent(marker.eventIndex)">
									<span>[[ marker.eventIndex + 1 ]]</span>
								</button>
							</div>
						</div>
					</div>
				</div>

				<aside class="col-12 col-xl-4" aria-label="Selected event details">
					<div class="card shadow-sm h-100">
						<div class="card-body p-4">
							<span class="badge text-bg-primary mb-3">
								Event [[ (selectedIndex + 1).toLocaleString() ]] of [[ events.length.toLocaleString() ]]
							</span>

							<h2 class="h3 mb-1">[[ selectedEvent.npcInfoRecord.npcName ]]</h2>
							<p class="text-body-secondary mb-4">[[ formatDate(selectedEvent.spawnedTime) ]]</p>

							<dl class="row g-3 mb-0">
								<div class="col-12">
									<div class="border rounded-1 p-3 bg-body-tertiary">
										<dt class="small text-uppercase text-body-secondary">Coordinate</dt>
										<dd class="fs-5 fw-semibold mb-0">
											[[ selectedEvent.playerInfoRecord.worldX ]], [[ selectedEvent.playerInfoRecord.worldY ]]
										</dd>
									</div>
								</div>

								<div class="col-sm-6 col-xl-12">
									<div class="border rounded-1 p-3 h-100">
										<dt class="small text-uppercase text-body-secondary">Since last random</dt>
										<dd class="fw-semibold mb-0">[[ formatDuration(selectedEvent.secondsSinceLastRandomEvent) ]]</dd>
									</div>
								</div>

								<div class="col-sm-6 col-xl-12">
									<div class="border rounded-1 p-3 h-100">
										<dt class="small text-uppercase text-body-secondary">Overall XP</dt>
										<dd class="fw-semibold mb-0">[[ selectedEvent.xpInfoRecord.overallExperience.toLocaleString() ]]</dd>
									</div>
								</div>
							</dl>
						</div>
					</div>
				</aside>
			</section>

			<section class="card shadow-sm mb-4" aria-label="Random event timeline">
				<div class="card-header bg-body p-3 p-lg-4">
					<div class="d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
						<div>
							<h2 class="h4 mb-1">Timeline</h2>
						</div>

						<div class="d-flex flex-column flex-sm-row align-items-sm-end gap-3">
							<label class="form-label mb-0">
								<span class="d-block small fw-semibold mb-1">Playback Speed</span>
								<select class="form-select" v-model.number="playbackSpeed" @change="changePlaybackSpeed">
									<option v-for="speed in playbackSpeeds" :key="speed" :value="speed">
										[[ speed ]] events/sec
									</option>
								</select>
							</label>

							<div class="btn-group" role="group" aria-label="Timeline playback controls">
								<button type="button" class="btn btn-outline-secondary" @click="previousEvent" :disabled="selectedIndex == 0">
									Previous
								</button>
								<button type="button" class="btn btn-primary" @click="togglePlayback">
									[[ isPlaying ? 'Pause' : 'Play' ]]
								</button>
								<button type="button" class="btn btn-outline-secondary" @click="nextEvent" :disabled="selectedIndex == events.length - 1">
									Next
								</button>
							</div>
						</div>
					</div>
				</div>

				<div class="card-body p-3 p-lg-4">
					<label class="w-100 mb-4" for="event-scrubber">
						<div class="d-flex justify-content-between small text-body-secondary mb-2">
							<span>Event 1</span>
							<span>Event [[ events.length.toLocaleString() ]]</span>
						</div>
						<input id="event-scrubber" class="form-range" type="range" min="0" :max="events.length - 1" step="1" v-model.number="selectedIndex" @input="stopPlayback">
					</label>

					<div class="timeline-list list-group">
						<div v-for="item in timelineWindow" :key="item.event.spawnedTime + '-' + item.index" class="timeline-event list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
							<span class="badge rounded-pill text-bg-secondary flex-shrink-0">[[ item.index + 1 ]]</span>

							<span class="flex-grow-1 text-start">
								<strong class="d-block">[[ item.event.npcInfoRecord.npcName ]]</strong>
								<small :class="item.index == selectedIndex ? 'text-white-50' : 'text-body-secondary'">
									[[ formatDate(item.event.spawnedTime) ]]
								</small>
							</span>

							<span class="font-monospace small text-nowrap">
								[[ item.event.npcInfoRecord.worldX ]], [[ item.event.npcInfoRecord.worldY ]]
							</span>
						</div>
					</div>
				</div>
			</section>

			<section class="card shadow-sm" aria-label="Random event dry-streak analysis">
				<div class="card-header bg-body p-3 p-lg-4">
					<div class="d-flex flex-column flex-lg-row align-items-lg-start justify-content-between gap-3">
						<div>
							<h2 class="h4 mb-1">Dry streaks by event</h2>
							<p class="text-body-secondary mb-0">
								"Dry" means at least [[ chanceDenominator ]] recorded random events have occurred since that NPC last appeared.
							</p>
						</div>
					</div>
				</div>

				<div class="card-body p-3 p-lg-4">
					<div class="table-responsive">
						<table class="analytics-table table table-hover table-striped align-middle mb-0">
							<thead class="table-dark">
								<tr>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('name')">
											<span>Event</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('name') ]]
											</span>
										</button>
									</th>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('count')">
											<span>Seen</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('count') ]]
											</span>
										</button>
									</th>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('expected')">
											<span>Expected</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('expected') ]]
											</span>
										</button>
									</th>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('difference')">
											<span>Vs expected</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('difference') ]]
											</span>
										</button>
									</th>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('longestDry')">
											<span>Longest between</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('longestDry') ]]
											</span>
										</button>
									</th>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('currentDry')">
											<span>Current dry</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('currentDry') ]]
											</span>
										</button>
									</th>
									<th scope="col">
										<button type="button" class="analytics-sort-button" @click="sortAnalytics('noHitProbability')">
											<span>Odds</span>
											<span class="analytics-sort-indicator" aria-hidden="true">
												[[ analyticsSortIndicator('noHitProbability') ]]
											</span>
										</button>
									</th>
								</tr>
							</thead>
							<tbody>
								<tr v-for="stat in eventStats" :key="stat.name" :class="{ 'is-dry-row': stat.isDryNow }">
									<th scope="row">
										<strong class="d-block">[[ stat.name ]]</strong>
										<small v-if="stat.lastSeenEvent" class="text-body-secondary">
											Last seen at event [[ stat.lastSeenEvent.toLocaleString() ]]
										</small>
										<small v-else class="text-body-secondary">Not seen in this log</small>
									</th>
									<td>[[ stat.count.toLocaleString() ]]</td>
									<td>[[ formatExpected(stat.expected) ]]</td>
									<td :class="stat.difference < 0 ? 'text-danger' : 'text-success'">
										[[ formatSigned(stat.difference) ]]
									</td>
									<td>[[ stat.longestDry.toLocaleString() ]]</td>
									<td>
										<strong class="d-block">[[ stat.currentDry.toLocaleString() ]]</strong>
										<small class="text-body-secondary">[[ stat.dryMultiplier.toFixed(1) ]]x 23</small>
									</td>
									<td>[[ formatPercent(stat.noHitProbability) ]]</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</section>
		</template>
	</main>

	<script src="bootstrap.js"></script>
	<script src="vue.js"></script>
	<script src="app.js?v=4"></script>
</body>

</html>
